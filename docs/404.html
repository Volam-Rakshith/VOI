    <script>
      /* Failsafe: if React never takes over, say so and offer a way out.
         A dead "LOADING" screen is never an acceptable end state. */
      (function () {
        var boot = window.__IMPOSTER_BOOT__ || (window.__IMPOSTER_BOOT__ = { ready: false, error: null });
        var GRACE_MS = 2000;
        var FAILSAFE_MS = 9000;
        var shown = false;

        function diagnose() {
          if (boot.error) return boot.error;
          if (location.protocol === 'file:') {
            return 'This page was opened straight from disk. Browsers refuse to run module scripts over file:// — start it with npm run dev (or npm run preview) and open the localhost address it prints.';
          }
          if (location.protocol === 'blob:' || location.protocol === 'data:') {
            return 'This page is running inside a sandboxed preview pane, which cannot load the app bundle. Open the real URL instead.';
          }
          return 'The application bundle did not finish loading. This usually means the site is serving the source folder instead of the built dist folder — on GitHub Pages, set Settings → Pages → Source to "GitHub Actions", or run npm run dev locally.';
        }

        function scriptTagReport() {
          var tags = document.querySelectorAll('script[type="module"][src]');
          if (!tags.length) return 'none found in HTML';
          var out = [];
          for (var i = 0; i < tags.length; i++) out.push(tags[i].getAttribute('src'));
          return out.join(', ');
        }

        function swReport() {
          if (!navigator.serviceWorker) return 'unsupported';
          if (navigator.serviceWorker.controller) return 'active (controlling this page)';
          return 'registered, not controlling';
        }

        function esc(s) {
          return String(s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
          });
        }

        function showCard() {
          if (shown || boot.ready) return;
          var host = document.getElementById('boot');
          if (!host) return;
          shown = true;
          var reason = diagnose();
          host.innerHTML =
            '<div class="boot-card">' +
            '<p class="boot-kicker">VR DEVELOPMENTS</p>' +
            '<h1 class="boot-title">VOTE OUT IMPOSTER could not start</h1>' +
            '<p class="boot-body">' + esc(reason) + '</p>' +
            '<div class="boot-actions">' +
            '<button class="boot-btn primary" id="boot-retry" type="button">Try again</button>' +
            '<button class="boot-btn" id="boot-fresh" type="button">Clear cache &amp; reload</button>' +
            '</div>' +
            '<details class="boot-diag"><summary>Diagnostics</summary><ul>' +
            '<li>Page: <code>' + esc(location.href) + '</code></li>' +
            '<li>Bundle: <code>' + esc(scriptTagReport()) + '</code></li>' +
            '<li>Service worker: <code>' + esc(swReport()) + '</code></li>' +
            '<li>Reported: <code>' + esc(boot.error || 'no resource error detected') + '</code></li>' +
            '</ul></details>' +
            '</div>';

          var retry = document.getElementById('boot-retry');
          if (retry) retry.addEventListener('click', function () { location.reload(); });

          var fresh = document.getElementById('boot-fresh');
          if (fresh) {
            fresh.addEventListener('click', function () {
              fresh.disabled = true;
              var done = function () {
                var url = location.href.split('#')[0] + '?fresh=' + Date.now() + location.hash;

                  }).then(done, done);
                } else {
                  done();
                }
              } catch (err) {
                done();
              }
            });
          }
        }

        function check() { if (!boot.ready) showCard(); }
        function schedule() { setTimeout(check, GRACE_MS); }

        if (document.readyState === 'complete') schedule();
        else window.addEventListener('load', schedule);
        setTimeout(check, FAILSAFE_MS);
      })();
