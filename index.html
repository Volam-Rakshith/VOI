<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
    <meta name="theme-color" content="#0B001A" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="IMPOSTER — a cinematic social deduction party game for 2-20 players. Pass & play on one device, or spin up an online room. By VR DEVELOPMENTS." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IMPOSTER" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="apple-touch-icon" href="icons/icon.svg" />
    <title>IMPOSTER — by VR DEVELOPMENTS</title>
    <style>
      /* Pre-hydration paint so users never see a white flash. */
      html, body { margin: 0; background: #0B001A; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        background:
          radial-gradient(1100px 640px at 50% -10%, rgba(124,58,237,.35), transparent 70%),
          radial-gradient(900px 520px at 90% 110%, rgba(34,211,238,.16), transparent 70%),
          #0B001A;
        color: #E9D5FF; font: 600 13px/1.4 system-ui, sans-serif; letter-spacing: .32em;
        text-transform: uppercase; transition: opacity .4s ease;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">Loading</div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
