<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Vote Out Imposter</title><style>:root{--g:#0b3d1e;--g2:#17a34a;--r:#e11d2e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#14532d,#04170b);color:#eafff0;font:18px system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center}

</style></head><body><div id=app></div><script>(function(g){

'Famous Characters':{doraemon:'gadget',sherlock:'detective',batman:'cape','chhota bheem':'laddu',pikachu:'electric',mickey:'cartoon'},
'Our Crew':{rakshith:'developer',sunil:'friend',rvbanr:'gang','vr developments':'startup',volam:'brand',sits:'college',flutter:'mobile',firebase:'database',groq:'speed',portfolio:'showcase',github:'repository'}};
const ok=(w,h)=>{w=w.toLowerCase();h=h.toLowerCase();return !!h&&h!==w&&!w.includes(h)&&!h.includes(w)&&w.slice(0,3)!==h.slice(0,3)&&!w.split(/\W+/).some(t=>h.split(/\W+/).includes(t))};

 let p=pool(o.cats).filter(x=>!(used||[]).includes(x.word));let reset=false;if(!p.length){if(!pool(o.cats).length)throw new Error('Empty word pool');p=pool(o.cats);reset=true}

</script><script>const $=document.getElementById('app'),K='voi-save';let S=JSON.parse(localStorage.getItem(K)||'null'),U={};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}},h=(t,c='')=>`<div class="${c}">${t}</div>`,btn=(l,f,c='')=>`<button class="${c}" onclick="${f}">${l}</button>`;

function finish(){const r=VOI.resolveVotes(S.active,S.votes,S.restrict);S.cycle++;S.restrict=null;S.votes={};S.vi=0;
 if(r.tied.length>1&&!S.revoted){S.revoted=true;S.restrict=r.tied;S.msg='Tie: '+r.tied.join(', ')+' ('+JSON.stringify(r.counts)+'). One revote.';return go('talk')}

 else if(S.resume){x=h('<h2>Game in progress</h2><p>Screen hidden for privacy.</p>')+btn('Resume',"S.resume=0;R()")+btn('Abandon',"quit()",'danger')}

</script><script>const OL={on:false,cfg:null,room:null,token:null,pub:null,me:null,err:'',shown:false,tm:null},ld=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}},sv=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

function chk(u,k){u=String(u||'').trim().replace(/\/+$/,'');k=String(k||'').trim();if(!/^https:\/\/[^\s/]+/.test(u))throw new Error('URL must start with https://');if(k.length<20)throw new Error('Key looks too short');

window.oAct=(a,x)=>act(a,x||{});window.oStart=()=>act('start',{imposters:+v('oi')});window.oGuess=()=>act('guess',{text:v('og')});window.oShow=()=>{OL.shown=!OL.shown;oR()};

 if(!OL.cfg)x=h('<h2>Connect to Supabase</h2><p class=r>⚠ Paste ONLY the anon PUBLIC key. NEVER paste a service_role key.</p>')+'<input id=cu placeholder="https://xxxx.supabase.co"><input id=ck placeholder="anon public key">'+btn('Save','saveCfg()');
 else if(!OL.room){const q=new URLSearchParams(location.search).get('room')||'';x=h('<h2>Play online</h2>')+'<input id=on placeholder="Your name" maxlength=20>'+btn('Create room','oCreate()')+`<input id=oc placeholder="Room code" value="${q}" maxlength=6 style="text-transform:uppercase">`+btn('Join room','oJoin()','ghost')}
 else if(!p)x=h('Connecting…');

  if(ph==='lobby')x=h(`<h2>Room <span class=r>${p.code}</span></h2><p>Invite: ${location.origin+location.pathname}?room=${p.code}</p>`)+list+(m.isHost?`<label>Imposters <input id=oi type=number min=1 value=1></label>`+btn('Start game','oStart()'):h('Waiting for host…'));
